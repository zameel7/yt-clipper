name = "yt-clipper-demo"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Origin allowed to call the demo (your GitHub Pages site).
[vars]
ALLOWED_ORIGIN = "https://zameel7.github.io"
RL_PER_IP_DAILY = "5"
RL_GLOBAL_DAILY = "300"
MAX_CLIPS = "6"

# Rate-limit counter store. Create it, then paste the id here:
#   npx wrangler kv namespace create RL
[[kv_namespaces]]
binding = "RL"
id = "REPLACE_WITH_KV_ID"

# Gemini key is a secret, NOT stored here:
#   npx wrangler secret put GEMINI_KEY
